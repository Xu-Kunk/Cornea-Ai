name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Real errors only (syntax errors, undefined names, broken comparisons).
  # The broader style ruleset (E,F,I,N,W,UP) is used locally during development;
  # applying it here would fail on legacy research scripts that are retained as
  # provenance rather than maintained as library code.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          args: "check --select E9,F63,F7,F82 --output-format=github ."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU-only torch first (small wheel), then the scientific stack.
      # Tests that need CUDA or full model weights must self-skip
      # (pytest.importorskip) since CI has no GPU.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-ci.txt
      - run: pytest tests/ -v
