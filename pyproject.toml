[project]
name = "corneal-fm"
version = "0.3.0"
description = "Tissue-specific fine-tuning of single-cell foundation models for corneal research"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Corneal-FM Team"}]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pyright]
# basedpyright 对第三方动态库（scverse/torch/zarr）类型存根不全产生系统性误报
# 2026-08-12 审计结论：1021 errors 中绝大多数为误报（抽样验证 BertConfig.num_labels、
# dict.get(bytes) 等均正常），非代码缺陷。以下按误报源降级，保留可读诊断信号。
typeCheckingMode = "basic"

# —— 完全关闭（动态库存根缺失导致的系统性噪音）——
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportAny = "none"
reportExplicitAny = "none"
reportUnusedCallResult = "none"
reportMissingParameterType = "none"
reportImplicitStringConcatenation = "none"
reportAttributeAccessIssue = "none"      # 374: 库属性未知（存根不全）
reportOptionalMemberAccess = "none"      # 83:  动态对象 None 推断误报
reportOptionalSubscript = "none"         # 44
reportMissingTypeArgument = "none"       # 200
reportMissingTypeStubs = "none"          # 221

# —— 降为 warning（保留提示，不阻塞）——
reportMissingImports = "warning"         # 104: 可选依赖未装（scrublet/flashinfer 等）
reportArgumentType = "warning"           # 293: 动态类型传参误报
reportCallIssue = "warning"              # 54:  重载/动态 API
reportPrivateImportUsage = "warning"     # 38
reportIndexIssue = "warning"             # 11
reportUnusedParameter = "warning"        # 70
reportUnannotatedClassAttribute = "warning"  # 66
