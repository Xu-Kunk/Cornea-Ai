# Paper1 External Test Source — LOCKED CONFIGURATION (GSE299152)
# Status: LOCKED 2026-08-10
# Authority: Paper1-Current-Design-2026-07-31.md §4 (external test #2, post-cutoff)
# Data: PNAS Nexus 2025 "Single-cell mapping of the glycocalyx in the adult
#       human and mouse ocular surface"; human donors Donor2046/2206/3748.
#       Annotated 2026-08-06 (mirror of the GSE153515 pipeline v2).
# DO NOT modify after locking without a new dated changelog.

external_test:
  accession: "GSE299152"
  geo_url: "https://www.ncbi.nlm.nih.gov/geo/query/acc.cgi?acc=GSE299152"
  description: "Human ocular surface (cornea-conjunctiva), 10x Genomics (GPL24676)"
  organism: "Homo sapiens"
  tissue: "cornea-conjunctiva (ocular surface)"
  modality: "scRNA-seq"
  platform: "10x Chromium"

  # Source independence (TRUE external: post-cutoff publication, not in corpus)
  training_collection: "0f7d022a-46c7-4e64-be4c-e34adbb78089"  # CELLxGENE Discover
  source_disjoint: true  # GSE299152 NOT in training collection (GEO public 2025-11-18; post-cutoff)
  donor_disjoint: true   # 3 donors (Donor2046/2206/3748) vs 49 training donors, 0 overlap

  # References (DOI verified via PubMed 2026-08-10)
  references:
    - doi: "10.1093/pnasnexus/pgaf348"
      pmid: "41245088"
      journal: "PNAS Nexus"
      year: 2025
  github: null  # no public code repository recorded in the GEO record

  # Local files
  raw_file: "data/gse299152/gse299152_human_raw.h5ad"
  raw_shape: [26628, 36601]
  annotated_file: "data/gse299152/gse299152_annotated.h5ad"
  annotated_shape: [23970, 11274]  # post-QC
  annotation_artifacts: "artifacts/gse299152_annotation/"

  # Donors (obs['donor'] == obs['donor_id'] values, pre-assigned — no barcode recovery)
  donors:
    Donor2046:
      geo_accession: "GSM9034552"
      n_cells_raw: 6930
      n_cells_annotated: 6434
    Donor2206:
      geo_accession: "GSM9034554"
      n_cells_raw: 12203
      n_cells_annotated: 11388
    Donor3748:
      geo_accession: "GSM9034550"
      n_cells_raw: 7495
      n_cells_annotated: 6148

# Annotation method (LOCKED; mirrors GSE153515 pipeline v2)
annotation:
  method: "deg_enrichment_cluster_annotation"
  deg_method: "wilcoxon"
  deg_n_genes: 200
  integration: "harmonypy"
  n_pcs: 30
  leiden_resolution: 0.7  # auto-tuned to land ~16 clusters; chose 0.7 -> 15 clusters
  n_clusters: 15
  marker_sets: 8  # + 2 supplementary guard sets (Endothelial/Stromal, 8 genes)
  ensembl_map_entries: 0  # GSE299152 stores real gene symbols in var.index (Ensembl IDs in var['gene_ids'])
  non_epi_threshold: 0.3
  script: "scripts/protocol_15b_annotate_gse299152.py"

  # Cell type distribution (post-QC, 23,970 cells; raw cluster assignment)
  cell_type_distribution:
    LPC: 10661       # 44.5% (clusters 0/4/5/8/10/12)
    LSC: 5260        # 21.9% (clusters 1/7/11/13)
    TDC: 4354        # 18.2% (clusters 2/6)
    conjunctival: 2596  # 10.8% (clusters 3/14)
    PMC_basal: 1099  # 4.6% (cluster 9)
    TAC: 0           # empty at res 0.7 (proliferation marker <0.6% of cells)
    melanocyte: 0    # cluster 13 sub-threshold (0.199 < 0.3) -> defaulted LSC
    endothelial: 0   # guard set near absent
    stromal: 0       # guard set near absent

  # 4-class harmonization (LOCKED, from provenance.json harmonize_map)
  harmonize_map:
    LPC: "LSC"
    LSC: "LSC"
    TAC: "TAC"
    PMC_basal: "basal"
    TDC: "differentiated"
    conjunctival: "NON_LAYER"
    endothelial: "NON_LAYER"
    immune_contamination: "NON_LAYER"
    melanocyte: "NON_LAYER"
    stromal: "NON_LAYER"

  harmonized_distribution:
    LSC: 15921
    TAC: 0
    basal: 1099
    differentiated: 4354
    NON_LAYER: 2596

  # Donor balance per harmonized type (post-QC)
  donor_balance:
    LSC: {Donor2046: 3341, Donor2206: 8374, Donor3748: 4206}    # 21/53/26%
    TAC: {Donor2046: 0, Donor2206: 0, Donor3748: 0}
    basal: {Donor2046: 721, Donor2206: 223, Donor3748: 155}     # 66/20/14%
    differentiated: {Donor2046: 1435, Donor2206: 1916, Donor3748: 1003}  # 33/44/23%
    NON_LAYER: {Donor2046: 937, Donor2206: 875, Donor3748: 784} # 36/34/30%

  # Known limitations
  limitations:
    - "TAC (layer 1) is EMPTY at the chosen resolution: no cluster enriched for the proliferation set (MKI67/BIRC5/RRM2/TOP2A/PLK1/TK1); MKI67 in ~0.5% of raw cells. The donor-level macro-F1 primary endpoint therefore includes a zero-support TAC class (f1=0 with zero_division=0) and is a 3-class-dominated average."
    - "Low-confidence clusters 7/11/12/13 (2,385 cells) have zero/near-zero DEG enrichment and were defaulted to LSC by the mirrored assign-every-cluster rule; see provenance.json strict_variant and gse299152_annotated_strict.h5ad (pre-registered robustness arm, these -> NON_LAYER)."
    - "Cluster 13 (148 cells) is a sub-threshold melanocyte cluster (enrichment 0.199 < 0.3 gate) defaulted to LSC."
    - "3 donors; donor-level bootstrap CI will be wider than the 2-donor GSE153515 run."

# Primary endpoint (LOCKED)
primary_endpoint:
  metric: "donor_level_macro_f1"
  description: "Macro-F1 computed per donor, then averaged across donors"
  confidence: "donor-level bootstrap 95% CI (n_boot=1000, seed=42)"
  classes: ["LSC", "TAC", "basal", "differentiated"]
  # NON_LAYER excluded from primary endpoint (not part of differentiation hierarchy)
  eval_classes_note: "NON_LAYER cells (conjunctival, immune, endothelial, stromal, melanocyte) excluded from macro-F1 computation"

# Secondary endpoints
secondary_endpoints:
  - metric: "marker_gradient_rank_correlation"
    description: "Spearman ρ between predicted differentiation score and canonical marker gradient"
  - metric: "layer_adjacency_accuracy"
    description: "Fraction of cells whose nearest-neighbor in embedding space shares an adjacent layer label"
  - metric: "trajectory_conservation"
    description: "GPR (Gradient Preservation Ratio) via scib trajectory_conservation"
  - metric: "calibration"
    description: "Expected calibration error (ECE) + reliability diagram"
  - metric: "ood_detection"
    description: "Confidence separation: in-distribution (training atlas) vs out-of-distribution (GSE299152)"

# Preprocessing for evaluation (LOCKED)
evaluation_preprocessing:
  # Applied to BOTH training test-split and external test before embedding/evaluation
  normalize: "normalize_total(1e4)"
  log_transform: "log1p"
  hvg: "highly_variable_genes(flavor='seurat', n_top_genes=2000)"
  scale: "scale(max_value=10)"
  pca: "pca(n_comps=30)"
  # For Geneformer arms: tokenization via gc104M tokenizer, no HVG/PCA

# Fair evaluation protocol (LOCKED)
fair_protocol:
  epochs: 3
  per_device_batch_size: 8
  gradient_accumulation_steps: 4
  effective_batch_size: 32
  precision: "bf16"
  gradient_checkpointing: true
  seeds: [42, 123, 456]
  lambda_values:
    naive_ft: 0.0
    caft: 0.5  # provisional from exploratory grid; NOT called optimal
  # All arms use identical preprocessing, split, head, epochs, batch, optimization, eval code
