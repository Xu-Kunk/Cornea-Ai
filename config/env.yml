# =============================================================================
# Corneal-FM Conda Environment — LEGACY (Windows x86_64 dev reference)
# =============================================================================
# DEPLOYMENT NOTE (2026-07-23): the production target is now
# ASUS Ascent GX10 / NVIDIA DGX Spark (GB10, aarch64, CUDA 13.0, Blackwell sm_121).
# Conda is NOT the deploy path there — the pytorch/nvidia conda channels do not
# provide cu130 aarch64 builds. On GX10 use ONE of:
#   1. NGC Docker:  docker pull nvcr.io/nvidia/pytorch:25.11-py3
#                   then `pip install -r config/requirements-gx10.txt` in-container
#   2. Native venv: source <your-venv>/bin/activate   (already has torch 2.13.0+cu130)
#                   then `pip install -r config/requirements-gx10.txt`
# Full procedure: docs/GX10-deployment-checklist.md
#
# This env.yml is kept as a CPU/x86 reference for local Windows preprocessing
# (protocol 01-05, 14, compute_cs_before). For GPU training, deploy on the GX10.
# =============================================================================
name: corneal-fm          # legacy Windows x86 CPU reference (pytorch-cuda 12.1)
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.4.0           # x86 build; for GX10 use torch 2.13.0+cu130 instead
  - pytorch-cuda=12.1       # GX10 requires CUDA 13.0 — this line does not apply there
  - scanpy>=1.10
  - anndata>=0.10
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - pyyaml
  - tqdm
  - h5py
  - pyarrow
  - transformers            # pin to geneformer's requirement at deploy time (~4.45.2)
  - datasets>=2.16
  - pip:
      - scgpt>=0.2.0        # flash-attn optional; skip on aarch64 -> SDPA
      - geneformer>=0.1.0   # install the jkobject fork at deploy time
      - click>=8.0
      - jupyter
      - ipykernel
